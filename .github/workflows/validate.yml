name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install jsonschema pytest
      - name: Validate examples against schemas
        run: python scripts/validate_examples.py
      - name: Run implementation kit tests
        run: pytest packages/python/tests -q
